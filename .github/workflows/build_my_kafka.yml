name: Build Apache Kafka with Scala 2.13

on:
  push:
    branches: [ main, master, 'releases/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发
    inputs:
      branch:
        description: '要构建的分支名称'
        required: true
        default: 'main'
        type: string
      scala-version:
        description: 'Scala版本'
        required: false
        default: '2.13.12'
        type: string
      skip-tests:
        description: '跳过测试'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=1g'
    
    steps:
    - name: Checkout specified branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch || github.ref }}
        fetch-depth: 0

    - name: Setup Java 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build with Scala ${{ github.event.inputs.scala-version || '2.13.12' }}
      run: |
        SCALA_VERSION="${{ github.event.inputs.scala-version || '2.13.12' }}"
        SKIP_TESTS="${{ github.event.inputs.skip-tests || 'false' }}"
        
        if [ "$SKIP_TESTS" = "true" ]; then
          ./gradlew build -x test -PscalaVersion=$SCALA_VERSION
        else
          ./gradlew build -PscalaVersion=$SCALA_VERSION
        fi

    - name: Create distribution package
      run: |
        SCALA_VERSION="${{ github.event.inputs.scala-version || '2.13.12' }}"
        ./gradlew distTar -PscalaVersion=$SCALA_VERSION

    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: kafka-scala-${{ github.event.inputs.scala-version || '2.13.12' }}-${{ github.sha }}
        path: |
          core/build/libs/*.jar
          streams/build/libs/*.jar
          clients/build/libs/*.jar
          build/distributions/*.tar.gz
